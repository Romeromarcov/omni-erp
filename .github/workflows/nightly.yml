name: Nightly

# Jobs lentos que no deben correr en cada PR (plan cero-dudas, Fase 0 → Fase 3).
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diario
  workflow_dispatch: {}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Mutation testing (mutmut) — MATRIX por módulo de cálculo puro.
  #
  # mutmut usa UN runner por corrida, así que la mutación por-módulo se hace con
  # una entrada de matrix por archivo, cada una con su runner rápido (test unit
  # puro y determinista). Se apunta a la lógica de CÁLCULO (no a la orquestación
  # ORM, que es lenta de mutar y de bajo valor). No-bloqueante: reporta el score;
  # el objetivo ≥80% se endurece en Fase 3.
  # ──────────────────────────────────────────────────────────────
  mutation:
    name: "Mutation (${{ matrix.nombre }})"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Los runners van por scripts/mut_runner.py, que normaliza el exit code
          # de pytest: mutmut solo cuenta como "killed" el exit 1, pero un mutante
          # que rompe el import del módulo hace fallar la COLECCIÓN (exit 2) y se
          # contaba como survived, subestimando el score (fix 2026-06-09).
          - nombre: "fiscal"
            paths: "apps/fiscal/services.py"
            runner: "python scripts/mut_runner.py tests/unit/test_fiscal_calculos.py"
          - nombre: "nomina_lottt"
            paths: "apps/nomina/calculo_lottt.py"
            runner: "python scripts/mut_runner.py tests/unit/test_nomina_lottt.py"
          - nombre: "cxc_scoring"
            paths: "apps/cuentas_por_cobrar/services_scoring.py"
            runner: "python scripts/mut_runner.py tests/unit/test_cxc_calculos.py"
          - nombre: "cxc_aging"
            paths: "apps/cuentas_por_cobrar/services_aging.py"
            runner: "python scripts/mut_runner.py tests/unit/test_cxc_calculos.py"
    env:
      DJANGO_ENV: dev
      SECRET_KEY: "ci-only-dummy-key-not-used-in-prod-xK9mPqR2nL8vJ4wY"
      # Los runners son unit puros (sin BD); declaramos las vars solo para que
      # config.settings importe sin fallar.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: omni_erp
      DB_USER: omni_erp
      DB_PASSWORD: omni_erp_ci
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: "Mutmut — ${{ matrix.nombre }}"
        working-directory: backend
        # No-bloqueante; reporta el score del módulo.
        run: |
          mutmut run \
            --paths-to-mutate="${{ matrix.paths }}" \
            --runner="${{ matrix.runner }}" \
            --no-progress || true
          echo "===== Resultados ${{ matrix.nombre }} ====="
          mutmut results || true

  # ──────────────────────────────────────────────────────────────
  # Auditoría nocturna de dependencias (Plan 06 §1.3 — H8)
  # Corre pip-audit y npm audit sin bloquear PRs ajenos y abre o
  # comenta un issue en GitHub con el detalle si detecta CVEs.
  # ──────────────────────────────────────────────────────────────
  dependency-audit:
    name: "Auditoría nocturna de dependencias (pip-audit + npm audit)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar dependencias Python (pip-audit)
        id: pip_audit
        working-directory: backend
        continue-on-error: true
        run: |
          set +e
          pip-audit -r requirements.txt > /tmp/pip-audit.log 2>&1
          STATUS=$?
          cat /tmp/pip-audit.log
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          exit "${STATUS}"

      - name: Auditar dependencias Node (npm audit)
        id: npm_audit
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high > /tmp/npm-audit.log 2>&1
          STATUS=$?
          cat /tmp/npm-audit.log
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          exit "${STATUS}"

      - name: Resumen de auditoría
        if: always()
        env:
          PIP_EXIT: ${{ steps.pip_audit.outputs.exit_code }}
          NPM_EXIT: ${{ steps.npm_audit.outputs.exit_code }}
        run: |
          {
            echo "## Auditoría nocturna de dependencias"
            echo ""
            echo "- \`pip-audit -r requirements.txt\`: exit \`${PIP_EXIT}\`"
            echo "- \`npm audit --audit-level=high\`: exit \`${NPM_EXIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir o comentar issue ante vulnerabilidades
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PIP_EXIT: ${{ steps.pip_audit.outputs.exit_code }}
          NPM_EXIT: ${{ steps.npm_audit.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Auditoría nocturna de dependencias"

          LABEL_ARG=""
          if gh label list --search "security" --json name -q '.[] | select(.name == "security") | .name' | grep -qx "security"; then
            LABEL_ARG="--label security"
          elif gh label create "security" --color "d93f0b" --description "Alertas de seguridad en dependencias" >/dev/null 2>&1; then
            LABEL_ARG="--label security"
          fi

          BODY_FILE="/tmp/audit-issue-body.md"
          {
            echo "## Auditoría nocturna de dependencias — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            if [ "${PIP_EXIT:-0}" != "0" ]; then
              echo "### \`pip-audit -r requirements.txt\` (exit ${PIP_EXIT:-1})"
              echo ""
              echo '```text'
              head -c 25000 /tmp/pip-audit.log || true
              echo ""
              echo '```'
              echo ""
            fi
            if [ "${NPM_EXIT:-0}" != "0" ]; then
              echo "### \`npm audit --audit-level=high\` (exit ${NPM_EXIT:-1})"
              echo ""
              echo '```text'
              head -c 25000 /tmp/npm-audit.log || true
              echo ""
              echo '```'
              echo ""
            fi
          } > "$BODY_FILE"

          EXISTING_NUM="$(gh issue list --state open --limit 100 --json number,title -q ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1 || true)"

          if [ -n "$EXISTING_NUM" ]; then
            gh issue comment "$EXISTING_NUM" --body-file "$BODY_FILE"
          elif [ -n "$LABEL_ARG" ]; then
            gh issue create --title "$TITLE" --label "security" --body-file "$BODY_FILE" \
              || gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
