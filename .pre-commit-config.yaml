# Pre-commit hooks para Omni ERP
# Docs: https://pre-commit.com
# Ejecutar manualmente: pre-commit run --all-files
repos:

  # ── Hooks generales de seguridad y limpieza ─────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^.*\.md$'
      - id: end-of-file-fixer
        exclude: '^.*\.md$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ── Python — Ruff (lint + formateo, Plan 06 D2) ─────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82,F823,F811,F401"]
        exclude: '^backend/apps/.*/migrations/.*\.py$'
      - id: ruff-format
        exclude: '^backend/apps/.*/migrations/.*\.py$'

  # ── Python — Bandit (seguridad estática, plan "cero dudas" Fase 0) ──────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'backend/.bandit.yaml', '--severity-level', 'medium']
        files: '^backend/(apps|config)/.*\.py$'

  # ── Secret scanning (gitleaks) ──────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Frontend — ESLint (TypeScript / React) ───────────────────────────────────
  - repo: local
    hooks:
      - id: eslint-frontend
        name: ESLint (frontend)
        language: node
        entry: bash -c 'cd frontend && npm run lint -- --max-warnings=0'
        files: '^frontend/src/.*\.(ts|tsx)$'
        pass_filenames: false

  # ── Matrices de superficie (A1) — mismo chequeo que CI ──────────────────────
  # mapa_superficie --check no necesita BD alcanzable, solo que DB_HOST exista.
  - repo: local
    hooks:
      - id: mapa-superficie
        name: Matrices de superficie al día (mapa_superficie --check)
        language: system
        entry: bash -c 'cd backend && DJANGO_ENV=dev SECRET_KEY=hook-local-no-secreto-0123456789abcdef0123456789abcdef DB_HOST=localhost DB_NAME=x DB_USER=x DB_PASSWORD=x python manage.py mapa_superficie --check || { echo "Regenera con  cd backend && python manage.py mapa_superficie  (y commitea solo las matrices que cambien de verdad)"; exit 1; }'
        files: '^backend/(apps|config)/.*(models|views|urls|tasks|mcp_tools|serializers)[^/]*\.py$|^backend/apps/.*/management/commands/.*\.py$'
        pass_filenames: false
        stages: [pre-push]
